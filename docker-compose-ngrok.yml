version: '3.8'

services:
  api:
    image: alexandreacff/vr:server
    container_name: biometria-api
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app/api
      - ./client:/app/client
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]


  ngrok:
    image: ngrok/ngrok:latest
    container_name: biometria-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "api:5000"
      - "--log"
      - "stdout"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - api