version: '3.8'

services:
  api:
    image: alexandreacff/vr:server
    container_name: biometria-api
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app/api
      - ./client:/app/client
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]